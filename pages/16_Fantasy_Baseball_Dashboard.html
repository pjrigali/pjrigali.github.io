<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fantasy Baseball Dashboard — In-Season Performance</title>
<meta name="description" content="Daily fantasy baseball roster comparison dashboard — track player performance vs league and free agents.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg-primary: #0d1117;
  --bg-secondary: #161b22;
  --bg-card: #1c2128;
  --bg-hover: #252c35;
  --border: #30363d;
  --border-subtle: #21262d;
  --text-primary: #e6edf3;
  --text-secondary: #8b949e;
  --text-muted: #6e7681;
  --accent-blue: #58a6ff;
  --accent-green: #3fb950;
  --accent-red: #f85149;
  --accent-orange: #d29922;
  --accent-purple: #b87fff;
  --accent-cyan: #39d2c0;
  --gradient-blue: linear-gradient(135deg, #1a3a5c 0%, #0d1117 100%);
  --gradient-green: linear-gradient(135deg, #1a3c28 0%, #0d1117 100%);
  --shadow-sm: 0 1px 2px rgba(0,0,0,0.3);
  --shadow-md: 0 4px 12px rgba(0,0,0,0.4);
  --shadow-lg: 0 8px 24px rgba(0,0,0,0.5);
  --radius-sm: 6px;
  --radius-md: 10px;
  --radius-lg: 14px;
}

body {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  background: var(--bg-primary);
  color: var(--text-primary);
  line-height: 1.5;
  min-height: 100vh;
}

/* --- Header --- */
.dashboard-header {
  background: var(--gradient-blue);
  border-bottom: 1px solid var(--border);
  padding: 24px 32px;
  position: sticky;
  top: 0;
  z-index: 100;
  backdrop-filter: blur(12px);
}

.header-content {
  max-width: 1400px;
  margin: 0 auto;
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 12px;
}

.header-title {
  display: flex;
  align-items: center;
  gap: 14px;
}

.header-title h1 {
  font-size: 1.5rem;
  font-weight: 800;
  letter-spacing: -0.02em;
  background: linear-gradient(135deg, var(--accent-blue), var(--accent-cyan));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}

.header-icon {
  font-size: 1.8rem;
}

.header-meta {
  display: flex;
  gap: 20px;
  align-items: center;
}

.meta-badge {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 0.8rem;
  color: var(--text-secondary);
  background: rgba(255,255,255,0.05);
  padding: 5px 12px;
  border-radius: 20px;
  border: 1px solid var(--border-subtle);
}

.meta-badge .dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--accent-green);
  animation: pulse 2s infinite;
}

@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.4; }
}

/* --- Position Tabs --- */
.position-nav {
  max-width: 1400px;
  margin: 0 auto;
  padding: 16px 32px 0;
}

.position-tabs {
  display: flex;
  gap: 4px;
  overflow-x: auto;
  padding-bottom: 4px;
  scrollbar-width: none;
}

.position-tabs::-webkit-scrollbar { display: none; }

.pos-tab {
  padding: 10px 18px;
  font-size: 0.82rem;
  font-weight: 600;
  color: var(--text-secondary);
  background: transparent;
  border: 1px solid transparent;
  border-bottom: 2px solid transparent;
  border-radius: var(--radius-sm) var(--radius-sm) 0 0;
  cursor: pointer;
  white-space: nowrap;
  transition: all 0.2s ease;
  letter-spacing: 0.03em;
}

.pos-tab:hover {
  color: var(--text-primary);
  background: var(--bg-secondary);
}

.pos-tab.active {
  color: var(--accent-blue);
  background: var(--bg-secondary);
  border-color: var(--border) var(--border) var(--accent-blue);
}

.tab-divider {
  width: 1px;
  background: var(--border);
  margin: 6px 4px;
}

/* --- Main Content --- */
.dashboard-body {
  max-width: 1400px;
  margin: 0 auto;
  padding: 20px 32px 60px;
}

.position-panel {
  display: none;
}

.position-panel.active {
  display: block;
}

/* --- Section Headers --- */
.section-header {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 14px;
  padding-bottom: 8px;
  border-bottom: 1px solid var(--border-subtle);
}

.section-header h2 {
  font-size: 1.05rem;
  font-weight: 700;
  letter-spacing: -0.01em;
}

.section-header .badge {
  font-size: 0.7rem;
  font-weight: 600;
  padding: 3px 8px;
  border-radius: 12px;
  letter-spacing: 0.04em;
}

.badge-my { background: rgba(88,166,255,0.15); color: var(--accent-blue); }
.badge-league { background: rgba(210,153,34,0.15); color: var(--accent-orange); }
.badge-fa { background: rgba(63,185,80,0.15); color: var(--accent-green); }
.badge-upgrade { background: rgba(63,185,80,0.2); color: var(--accent-green); border: 1px solid rgba(63,185,80,0.3); }

/* --- Player Cards (My Players) --- */
.my-players-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
  gap: 14px;
  margin-bottom: 28px;
}

.player-card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  padding: 18px;
  transition: all 0.2s ease;
  position: relative;
  overflow: hidden;
}

.player-card::before {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 3px;
  background: linear-gradient(90deg, var(--accent-blue), var(--accent-cyan));
}

.player-card:hover {
  border-color: var(--accent-blue);
  box-shadow: var(--shadow-md);
  transform: translateY(-1px);
}

.card-header {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  margin-bottom: 14px;
}

.card-name {
  font-size: 1rem;
  font-weight: 700;
}

.card-team {
  font-size: 0.78rem;
  color: var(--text-secondary);
  margin-top: 2px;
}

.card-injury {
  font-size: 0.7rem;
  padding: 2px 8px;
  border-radius: 10px;
  font-weight: 600;
}

.injury-active { background: rgba(63,185,80,0.1); color: var(--accent-green); }
.injury-dtd { background: rgba(210,153,34,0.15); color: var(--accent-orange); }
.injury-out { background: rgba(248,81,73,0.15); color: var(--accent-red); }
.injury-il { background: rgba(248,81,73,0.2); color: var(--accent-red); }

.stat-grid {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 6px;
}

.stat-cell {
  text-align: center;
  padding: 6px 4px;
  border-radius: var(--radius-sm);
  background: rgba(255,255,255,0.03);
}

.stat-label {
  font-size: 0.65rem;
  font-weight: 600;
  color: var(--text-muted);
  letter-spacing: 0.06em;
  text-transform: uppercase;
}

.stat-value {
  font-size: 0.95rem;
  font-weight: 700;
  margin-top: 2px;
}

.stat-trend {
  font-size: 0.65rem;
  margin-top: 2px;
  font-weight: 500;
}

.trend-up { color: var(--accent-green); }
.trend-down { color: var(--accent-red); }
.trend-flat { color: var(--text-muted); }

/* --- Stat Coloring --- */
.stat-above { color: var(--accent-green); }
.stat-below { color: var(--accent-red); }
.stat-neutral { color: var(--text-primary); }

/* --- Window Toggle --- */
.window-toggle {
  display: flex;
  gap: 4px;
  margin-bottom: 14px;
}

.window-btn {
  padding: 5px 12px;
  font-size: 0.72rem;
  font-weight: 600;
  color: var(--text-secondary);
  background: var(--bg-secondary);
  border: 1px solid var(--border);
  border-radius: 16px;
  cursor: pointer;
  transition: all 0.2s;
}

.window-btn:hover { background: var(--bg-hover); }
.window-btn.active { background: var(--accent-blue); color: #fff; border-color: var(--accent-blue); }

/* --- Tables --- */
.stat-table-wrapper {
  overflow-x: auto;
  border-radius: var(--radius-md);
  border: 1px solid var(--border);
  margin-bottom: 28px;
}

.stat-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 0.82rem;
}

.stat-table thead {
  position: sticky;
  top: 0;
  z-index: 10;
}

.stat-table th {
  padding: 10px 14px;
  text-align: left;
  font-weight: 600;
  font-size: 0.72rem;
  letter-spacing: 0.05em;
  text-transform: uppercase;
  color: var(--text-muted);
  background: var(--bg-secondary);
  border-bottom: 1px solid var(--border);
  white-space: nowrap;
  cursor: pointer;
  user-select: none;
  transition: color 0.15s;
}

.stat-table th:hover { color: var(--accent-blue); }
.stat-table th.sort-asc::after { content: ' ▲'; font-size: 0.6rem; }
.stat-table th.sort-desc::after { content: ' ▼'; font-size: 0.6rem; }

.stat-table td {
  padding: 9px 14px;
  border-bottom: 1px solid var(--border-subtle);
  white-space: nowrap;
}

.stat-table tbody tr {
  transition: background 0.15s;
}

.stat-table tbody tr:hover {
  background: var(--bg-hover);
}

.stat-table tbody tr.highlight-my {
  background: rgba(88,166,255,0.06);
  border-left: 3px solid var(--accent-blue);
}

.stat-table tbody tr.highlight-my:hover {
  background: rgba(88,166,255,0.1);
}

.player-name-cell {
  font-weight: 600;
}

.owner-cell {
  color: var(--text-secondary);
  font-size: 0.78rem;
}

.owner-fa {
  color: var(--accent-green);
  font-weight: 600;
}

/* Upgrade indicator */
.upgrade-indicator {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  font-size: 0.7rem;
  font-weight: 600;
  padding: 2px 8px;
  border-radius: 10px;
  background: rgba(63,185,80,0.12);
  color: var(--accent-green);
  margin-left: 8px;
}

.upgrade-indicator::before {
  content: '▲';
  font-size: 0.55rem;
}

/* --- Empty State --- */
.empty-state {
  text-align: center;
  padding: 40px;
  color: var(--text-muted);
  font-size: 0.9rem;
}

/* --- Footer --- */
.dashboard-footer {
  text-align: center;
  padding: 24px;
  color: var(--text-muted);
  font-size: 0.75rem;
  border-top: 1px solid var(--border-subtle);
  max-width: 1400px;
  margin: 0 auto;
}

.dashboard-footer a {
  color: var(--accent-blue);
  text-decoration: none;
}

/* --- Responsive --- */
@media (max-width: 768px) {
  .dashboard-header { padding: 16px; }
  .position-nav { padding: 12px 16px 0; }
  .dashboard-body { padding: 16px 16px 40px; }
  .my-players-grid { grid-template-columns: 1fr; }
  .header-title h1 { font-size: 1.2rem; }
  .header-meta { flex-wrap: wrap; gap: 8px; }
}
</style>
</head>

<!-- Header -->
<header class="dashboard-header">
  <div class="header-content">
    <div class="header-title">
      <span class="header-icon">⚾</span>
      <div>
        <h1 id="teamTitle">Fantasy Baseball Dashboard</h1>

</nav>

<!-- Dashboard Body -->
<main class="dashboard-body" id="dashboardBody"></main>

<!-- Footer -->
<footer class="dashboard-footer">

</footer>

const BATTER_POSITIONS = ['C', '1B', '2B', '3B', 'SS', 'OF', 'DH'];
const PITCHER_POSITIONS = ['SP', 'RP'];
const BATTER_STATS = ['R', 'HR', 'RBI', 'SB', 'OPS'];
const PITCHER_STATS = ['K/9', 'QS', 'SVHD', 'ERA', 'WHIP'];
const INVERSE_STATS = new Set(['ERA', 'WHIP']);  // lower = better
const WINDOWS = ['season', 'last15days', 'last30days', 'last7days'];
const WINDOW_LABELS = { season: 'Season', last7days: 'Last 7 Days', last15days: 'Last 15 Days', last30days: 'Last 30 Days' };

let currentWindow = 'season';
let currentPos = 'C';

// --- Initialize ---
document.addEventListener('DOMContentLoaded', () => {
  if (!DASHBOARD_DATA || !DASHBOARD_DATA.positions) {
    document.getElementById('dashboardBody').innerHTML = '<div class="empty-state">No data loaded. Run collect_dashboard_data.py first.</div>';
    return;
  }

  // Header
  document.getElementById('teamTitle').textContent = `${DASHBOARD_DATA.my_team_name || 'My Team'} — Performance Dashboard`;
  document.getElementById('teamSubtitle').textContent = `Roster Comparison vs League & Free Agents`;
  document.getElementById('refreshTime').textContent = `Updated: ${DASHBOARD_DATA.generated_at || '—'}`;
  document.getElementById('seasonLabel').textContent = `${DASHBOARD_DATA.season || ''} Season`;

  // Tab clicks
  document.querySelectorAll('.pos-tab').forEach(tab => {
    tab.addEventListener('click', () => {
      document.querySelectorAll('.pos-tab').forEach(t => t.classList.remove('active'));
      tab.classList.add('active');
      currentPos = tab.dataset.pos;
      renderPosition(currentPos);
    });
  });

  renderPosition('C');
});


function renderPosition(pos) {
  const body = document.getElementById('dashboardBody');
  const data = DASHBOARD_DATA.positions[pos];
  if (!data) {
    body.innerHTML = '<div class="empty-state">No data available for this position.</div>';
    return;
  }

  const isBatter = BATTER_POSITIONS.includes(pos);
  const statCols = isBatter ? BATTER_STATS : PITCHER_STATS;

  // Compute position medians for coloring
  const allPlayers = [...(data.my_players || []), ...(data.league_players || []), ...(data.free_agents || [])];
  const medians = computeMedians(allPlayers, statCols, currentWindow);

  let html = '';

  // Window toggle
  html += `<div class="window-toggle">`;
  for (const w of WINDOWS) {
    html += `<button class="window-btn ${w === currentWindow ? 'active' : ''}" onclick="setWindow('${w}')">${WINDOW_LABELS[w]}</button>`;
  }
  html += `</div>`;

  // === My Players Section ===
  html += `<div class="section-header"><h2>📌 Your Roster</h2><span class="badge badge-my">${(data.my_players || []).length} players</span></div>`;
  if (data.my_players && data.my_players.length > 0) {
    html += `<div class="my-players-grid">`;
    for (const player of data.my_players) {
      html += renderPlayerCard(player, statCols, medians);
    }
    html += `</div>`;
  } else {
    html += `<div class="empty-state">No players at this position on your roster.</div>`;
  }

  // === League Comparison Table ===
  const leagueAndMine = [...(data.my_players || []).map(p => ({...p, _isMine: true})),
                          ...(data.league_players || []).map(p => ({...p, _isMine: false}))];
  html += `<div class="section-header"><h2>🏆 League Comparison</h2><span class="badge badge-league">${leagueAndMine.length} rostered</span></div>`;
  if (leagueAndMine.length > 0) {
    html += renderTable(leagueAndMine, statCols, medians, 'league');
  } else {
    html += `<div class="empty-state">No league data available.</div>`;
  }

  // === Free Agent Highlights ===
  const faList = data.free_agents || [];
  const upgradeCount = countUpgrades(data.my_players, faList, statCols);
  html += `<div class="section-header"><h2>🆓 Free Agent Highlights</h2><span class="badge badge-fa">${faList.length} available</span>`;
  if (upgradeCount > 0) {
    html += `<span class="badge badge-upgrade">⬆ ${upgradeCount} potential upgrade${upgradeCount > 1 ? 's' : ''}</span>`;
  }
  html += `</div>`;
  if (faList.length > 0) {
    html += renderTable(faList, statCols, medians, 'fa');
  } else {
    html += `<div class="empty-state">No free agents available at this position.</div>`;
  }

  body.innerHTML = html;

  // Attach sort listeners
  body.querySelectorAll('th[data-sort]').forEach(th => {
    th.addEventListener('click', () => handleSort(th));
  });
}

function setWindow(w) {
  currentWindow = w;
  renderPosition(currentPos);
}


function renderPlayerCard(player, statCols, medians) {
  const stats = player.stats || {};
  const seasonStats = stats[currentWindow] || stats['season'] || {};
  const last15 = stats['last15days'] || {};

  let injuryClass = 'injury-active';
  let injuryLabel = 'Active';
  if (player.injuryStatus === 'DAY_TO_DAY' || player.injuryStatus === 'DTD') {
    injuryClass = 'injury-dtd'; injuryLabel = 'DTD';
  } else if (player.injuryStatus === 'OUT') {
    injuryClass = 'injury-out'; injuryLabel = 'OUT';
  } else if (player.injuryStatus === 'INJURY_RESERVE' || player.injuryStatus === 'IL') {
    injuryClass = 'injury-il'; injuryLabel = 'IL';
  }

  let html = `<div class="player-card">`;
  html += `<div class="card-header">`;
  html += `<div><div class="card-name">${player.name}</div><div class="card-team">${player.proTeam || ''} · ${player.position}</div></div>`;
  html += `<span class="card-injury ${injuryClass}">${injuryLabel}</span>`;
  html += `</div>`;

  // Stats grid
  html += `<div class="stat-grid">`;
  for (const stat of statCols) {
    const val = seasonStats[stat];
    const display = formatStat(val, stat);
    const colorClass = getStatColor(val, stat, medians);

    // Trend from last15 vs season
    let trendHtml = '';
    if (currentWindow === 'season') {
      const recentVal = last15[stat];
      if (recentVal !== undefined && val !== undefined) {
        const diff = recentVal - val;
        const isInverse = INVERSE_STATS.has(stat);
        if (Math.abs(diff) > 0.001) {
          const isUp = isInverse ? diff < 0 : diff > 0;
          trendHtml = `<div class="stat-trend ${isUp ? 'trend-up' : 'trend-down'}">${isUp ? '▲' : '▼'} L15</div>`;
        } else {
          trendHtml = `<div class="stat-trend trend-flat">— L15</div>`;
        }
      }
    }

    html += `<div class="stat-cell"><div class="stat-label">${stat}</div><div class="stat-value ${colorClass}">${display}</div>${trendHtml}</div>`;
  }
  html += `</div></div>`;
  return html;
}


function renderTable(players, statCols, medians, tableType) {
  // Initial sort: first stat desc (or asc for inverse)
  const defaultSort = statCols[statCols.length === 5 ? 4 : 0]; // OPS or K/9

  let sorted = [...players].sort((a, b) => {
    const aVal = getStat(a, defaultSort);
    const bVal = getStat(b, defaultSort);
    if (INVERSE_STATS.has(defaultSort)) return aVal - bVal;
    return bVal - aVal;
  });

  let html = `<div class="stat-table-wrapper"><table class="stat-table" id="table-${tableType}-${currentPos}">`;

  // Header
  html += `<thead><tr>`;
  html += `<th data-sort="rank" style="width:40px">#</th>`;
  html += `<th data-sort="name">Player</th>`;
  html += `<th data-sort="owner">Owner</th>`;
  html += `<th data-sort="proTeam">Team</th>`;
  for (const stat of statCols) {
    html += `<th data-sort="${stat}" data-stat="${stat}">${stat}</th>`;
  }
  if (tableType === 'fa') {
    html += `<th data-sort="upgrade">Upgrade</th>`;
  }
  html += `</tr></thead><tbody>`;

  // Rows
  for (let i = 0; i < sorted.length; i++) {
    const p = sorted[i];
    const isMine = p._isMine;
    html += `<tr class="${isMine ? 'highlight-my' : ''}">`;
    html += `<td style="color:var(--text-muted)">${i + 1}</td>`;
    html += `<td class="player-name-cell">${p.name}${isMine ? ' ⭐' : ''}</td>`;

    const ownerClass = p.owner === 'Free Agent' ? 'owner-fa' : 'owner-cell';
    html += `<td class="${ownerClass}">${p.owner}</td>`;
    html += `<td style="color:var(--text-secondary)">${p.proTeam || '—'}</td>`;

    for (const stat of statCols) {
      const val = getStat(p, stat);
      const display = formatStat(val, stat);
      const colorClass = getStatColor(val, stat, medians);
      html += `<td class="${colorClass}">${display}</td>`;
    }

    if (tableType === 'fa') {
      const upgradeScore = computeUpgradeScore(p, statCols);
      if (upgradeScore >= 3) {
        html += `<td><span class="upgrade-indicator">${upgradeScore}/5</span></td>`;
      } else {
        html += `<td></td>`;
      }
    }

    html += `</tr>`;
  }

  html += `</tbody></table></div>`;
  return html;
}


// --- Utility Functions ---

function getStat(player, stat) {
  const stats = player.stats || {};
  const windowStats = stats[currentWindow] || stats['season'] || {};
  return windowStats[stat];
}

function formatStat(val, stat) {
  if (val === undefined || val === null || isNaN(val)) return '—';
  if (['OPS', 'AVG', 'OBP', 'SLG', 'WHIP'].includes(stat)) return val.toFixed(3);
  if (['ERA', 'K/9'].includes(stat)) return val.toFixed(2);
  if (['SB', 'R', 'HR', 'RBI', 'QS', 'SVHD'].includes(stat)) return Math.round(val);
  return typeof val === 'number' ? val.toFixed(2) : val;
}

function computeMedians(players, statCols) {
  const medians = {};
  for (const stat of statCols) {
    const vals = players.map(p => getStat(p, stat)).filter(v => v !== undefined && v !== null && !isNaN(v));
    vals.sort((a, b) => a - b);
    if (vals.length > 0) {
      const mid = Math.floor(vals.length / 2);
      medians[stat] = vals.length % 2 ? vals[mid] : (vals[mid - 1] + vals[mid]) / 2;
    }
  }
  return medians;
}

function getStatColor(val, stat, medians) {
  if (val === undefined || val === null || isNaN(val)) return 'stat-neutral';
  const med = medians[stat];
  if (med === undefined) return 'stat-neutral';
  const isInverse = INVERSE_STATS.has(stat);
  if (isInverse) {
    return val < med ? 'stat-above' : val > med ? 'stat-below' : 'stat-neutral';
  }
  return val > med ? 'stat-above' : val < med ? 'stat-below' : 'stat-neutral';
}

function countUpgrades(myPlayers, freAgents, statCols) {
  if (!myPlayers || myPlayers.length === 0) return 0;
  let count = 0;
  for (const fa of freAgents) {
    const score = computeUpgradeScore(fa, statCols);
    if (score >= 3) count++;
  }
  return count;
}

function computeUpgradeScore(faPlayer, statCols) {
  // Compare FA's last15days stats vs the position data
  // A simple heuristic: count how many stats are above the median
  const stats = faPlayer.stats || {};
  const windowStats = stats['last15days'] || stats[currentWindow] || stats['season'] || {};
  let aboveCount = 0;
  const posData = DASHBOARD_DATA.positions[currentPos];
  if (!posData) return 0;

  const allRostered = [...(posData.my_players || []), ...(posData.league_players || [])];
  const medians = computeMedians(allRostered, statCols);

  for (const stat of statCols) {
    const val = windowStats[stat];
    if (val === undefined) continue;
    const med = medians[stat];
    if (med === undefined) continue;
    const isInverse = INVERSE_STATS.has(stat);
    if (isInverse ? val < med : val > med) aboveCount++;
  }
  return aboveCount;
}


function handleSort(th) {
  const table = th.closest('table');
  const tbody = table.querySelector('tbody');
  const rows = Array.from(tbody.querySelectorAll('tr'));
  const sortKey = th.dataset.sort;
  const statName = th.dataset.stat;

  // Toggle direction
  const wasAsc = th.classList.contains('sort-asc');
  table.querySelectorAll('th').forEach(h => { h.classList.remove('sort-asc', 'sort-desc'); });

  const ascending = !wasAsc;
  th.classList.add(ascending ? 'sort-asc' : 'sort-desc');

  rows.sort((a, b) => {
    let aVal, bVal;
    if (sortKey === 'rank') {
      aVal = parseInt(a.cells[0].textContent);
      bVal = parseInt(b.cells[0].textContent);
    } else if (sortKey === 'name') {
      aVal = a.cells[1].textContent;
      bVal = b.cells[1].textContent;
      return ascending ? aVal.localeCompare(bVal) : bVal.localeCompare(aVal);
    } else if (sortKey === 'owner') {
      aVal = a.cells[2].textContent;
      bVal = b.cells[2].textContent;
      return ascending ? aVal.localeCompare(bVal) : bVal.localeCompare(aVal);
    } else if (sortKey === 'proTeam') {
      aVal = a.cells[3].textContent;
      bVal = b.cells[3].textContent;
      return ascending ? aVal.localeCompare(bVal) : bVal.localeCompare(aVal);
    } else if (sortKey === 'upgrade') {
      const colIdx = a.cells.length - 1;
      aVal = parseFloat(a.cells[colIdx].textContent) || 0;
      bVal = parseFloat(b.cells[colIdx].textContent) || 0;
    } else {
      // Stat column — find the column index
      const headers = Array.from(table.querySelectorAll('th'));
      const colIdx = headers.indexOf(th);
      aVal = parseFloat(a.cells[colIdx].textContent) || 0;
      bVal = parseFloat(b.cells[colIdx].textContent) || 0;
    }
    return ascending ? aVal - bVal : bVal - aVal;
  });

  // Re-number
  rows.forEach((row, i) => { row.cells[0].textContent = i + 1; });
  rows.forEach(row => tbody.appendChild(row));
}
